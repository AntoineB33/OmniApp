app = 'listener-blue-snowflake-2004'
primary_region = 'cdg'

[build]

# This is a pure background worker — it opens NO HTTP port, so there is no
# [http_service] block. With auto_stop/http health-checks removed, the machine
# just runs 24/7, which is the whole point of the listener.

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
