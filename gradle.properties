#Kotlin
kotlin.code.style=official
# 6 GB, not 3: `shared` is compiled for five targets at once in one daemon, and a full recompile (a cold daemon, a
# build-script change) ran it out of a 3 GB heap -- OutOfMemoryError, or ~20 min per target thrashing in GC (2026-11-15).
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true